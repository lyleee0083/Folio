name: Build Folio Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - name: Test Folio
        run: |
          $env:CARGO_HOME = Join-Path $env:GITHUB_WORKSPACE 'work\cargo-home'
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE 'work\rust-build'
          cargo test --release --locked --manifest-path src/rust/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build the Windows installer
        run: .\scripts\Build-Installer.ps1 -RestoreTools
      - name: Test the MSI payload
        run: .\scripts\Test-Installer.ps1
      - name: Upload the MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: generated/Folio-*-win-x64.msi
          if-no-files-found: error
          archive: false
          retention-days: 30
