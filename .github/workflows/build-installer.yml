name: Build Folio Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-x86_64-pc-windows-msvc
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - name: Compile Folio and run Rust tests
        run: .\scripts\Build-Native.ps1 -UnitTest
      - name: Build and verify the Windows installer
        run: .\scripts\Build-Installer.ps1 -RestoreTools -Verify
      - name: Upload the MSI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Folio-Windows-x64
          path: generated/Folio-*-win-x64.msi
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
